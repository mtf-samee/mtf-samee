<svg xmlns="http://www.w3.org/2000/svg" width="800" height="42" viewBox="0 0 800 42" role="img" aria-labelledby="title desc">
  <title id="title">ARTEMIS motivation ticker</title>
  <desc id="desc">A looping cyan and purple news-style ticker with cybersecurity and engineering mottos.</desc>
  <defs>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#00E5FF"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
    <clipPath id="window"><rect x="0" y="0" width="800" height="42" rx="5"/></clipPath>
  </defs>
  <rect width="800" height="42" rx="5" fill="#0D1117" stroke="#164E63"/>
  <rect width="94" height="42" rx="5" fill="url(#accent)"/>
  <rect x="89" width="5" height="42" fill="#A855F7"/>
  <circle cx="16" cy="21" r="4" fill="#0D1117"/>
  <text x="27" y="25" font-family="monospace" font-size="12" font-weight="700" fill="#0D1117">SIGNAL</text>
  <g clip-path="url(#window)">
    <g transform="translate(106 0)">
      <g>
        <text x="0" y="25" font-family="monospace" font-size="13" font-weight="600" fill="#00E5FF">LEARN. REVERSE ENGINEER. BUILD.</text>
        <text x="265" y="25" font-family="monospace" font-size="13" fill="#A855F7">◆</text>
        <text x="292" y="25" font-family="monospace" font-size="13" font-weight="600" fill="#C9D1D9">THINK LIKE AN ATTACKER. BUILD LIKE AN ENGINEER.</text>
        <text x="650" y="25" font-family="monospace" font-size="13" fill="#A855F7">◆</text>
        <text x="677" y="25" font-family="monospace" font-size="13" font-weight="600" fill="#00E5FF">TRACE THE EVIDENCE.</text>
      </g>
      <g transform="translate(800 0)">
        <text x="0" y="25" font-family="monospace" font-size="13" font-weight="600" fill="#00E5FF">LEARN. REVERSE ENGINEER. BUILD.</text>
        <text x="265" y="25" font-family="monospace" font-size="13" fill="#A855F7">◆</text>
        <text x="292" y="25" font-family="monospace" font-size="13" font-weight="600" fill="#C9D1D9">THINK LIKE AN ATTACKER. BUILD LIKE AN ENGINEER.</text>
        <text x="650" y="25" font-family="monospace" font-size="13" fill="#A855F7">◆</text>
        <text x="677" y="25" font-family="monospace" font-size="13" font-weight="600" fill="#00E5FF">TRACE THE EVIDENCE.</text>
      </g>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-800 0" dur="20s" repeatCount="indefinite"/>
    </g>
  </g>
</svg>